minimum_pre_commit_version: "3.5.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Python: ruff replaces flake8 + flake8-print + isort + pyupgrade.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff-check
        args: [--fix]
        types: [python]
      - id: ruff-format
        types: [python]

  # Go: format + vet via local hooks (avoid third-party hook repo churn).
  - repo: local
    hooks:
      - id: go-fmt
        name: go fmt
        entry: bash -c 'cd watcher && gofmt -l .'
        language: system
        types: [go]
        pass_filenames: false
      - id: go-vet
        name: go vet
        entry: bash -c 'cd watcher && go vet ./...'
        language: system
        types: [go]
        pass_filenames: false

  # Secret scanning via the open-source gitleaks CLI (MIT license; not the
  # proprietary gitleaks-action).
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Custom local hook: eval gate runs only when eval/ files change. Skipped
  # in CI via SKIP=eval-gate (requires running stack).
  - repo: local
    hooks:
      - id: eval-gate
        name: eval gate (Jaccard regression)
        entry: pytest tests/test_eval_gate.py --smoke -q
        language: system
        pass_filenames: false
        files: ^eval/
        stages: [pre-push]
