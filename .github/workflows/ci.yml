name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  python-ci:
    name: Python CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv + Python 3.12
        uses: astral-sh/setup-uv@v8
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: |
            requirements-dev.txt
            hub/**/requirements*.txt

      - name: Install Python dependencies
        run: uv pip sync requirements-dev.txt --system

      - name: Cache pre-commit envs
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-${{ runner.os }}-

      - name: Run pre-commit (lint + secret scan, eval-gate skipped)
        run: |
          uv pip install pre-commit --system
          SKIP=eval-gate pre-commit run --all-files
        env:
          PRE_COMMIT_HOME: ~/.cache/pre-commit

      - name: mypy (hub/)
        run: mypy hub

      - name: Unit tests (smoke skipped by default)
        run: pytest tests/ -q

      - name: Smoke tests (opt-in via repo variable)
        if: vars.RUN_SMOKE_IN_CI == 'true'
        run: pytest tests/smoke/ -m smoke --smoke -v

  go-ci:
    name: Go CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watcher
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: true
          cache-dependency-path: watcher/go.sum

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (with race detector)
        run: go test -race -v ./...
